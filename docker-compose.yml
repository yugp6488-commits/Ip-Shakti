version: '3.8'

services:
  # 1. Vector Database for Legal Statutes (pgvector)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ipsakti_postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ipsakti_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_password}
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Knowledge Graph for Botanical Entities (Neo4j)
  neo4j:
    image: neo4j:5.15-community
    container_name: ipsakti_neo4j
    ports:
      - "127.0.0.1:7474:7474"   # Neo4j Browser
      - "127.0.0.1:7687:7687"   # Bolt Protocol
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-admin_password}
    volumes:
      - neo4jdata:/data

  # 3. Session State & Cache (Redis)
  redis:
    image: redis:7-alpine
    container_name: ipsakti_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret_placeholder}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

volumes:
  pgdata:
  neo4jdata:
  redis_data: